name: ESP32 Weather Station Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile ESP32 Weather Station
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Install Arduino CLI
      #
      # This is the same installation mechanism used by the
      # previously successful Single_RoomAutomation workflow.
      # ==========================================================
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # ==========================================================
      # 3. Configure Arduino CLI + ESP32 package index
      # ==========================================================
      - name: Configure Arduino CLI
        run: |
          set -e

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core update-index

      # ==========================================================
      # 4. Install VERIFIED ESP32 Arduino Core
      #
      # 3.3.11 was successfully used by your other GitHub project.
      # ==========================================================
      - name: Install ESP32 Arduino Core 3.3.11
        run: |
          set -e

          arduino-cli core install esp32:esp32@3.3.11

          echo ""
          echo "=========================================="
          echo "INSTALLED ESP32 CORE"
          echo "=========================================="

          arduino-cli core list

      # ==========================================================
      # 5. Update Arduino Library Index
      # ==========================================================
      - name: Update Arduino library index
        run: |
          set -e

          arduino-cli lib update-index

      # ==========================================================
      # 6. Install Weather Station dependencies
      # ==========================================================
      - name: Install Weather Station libraries
        run: |
          set -e

          echo "Installing WiFiManager..."
          arduino-cli lib install "WiFiManager@2.0.17"

          echo "Installing ArduinoJson..."
          arduino-cli lib install "ArduinoJson@7.4.3"

          echo "Installing ESPAsyncWebServer..."
          arduino-cli lib install "ESP Async WebServer@3.6.0"

          echo "Installing AsyncTCP..."
          arduino-cli lib install "Async TCP@3.3.2"

          echo "Installing Adafruit GFX..."
          arduino-cli lib install "Adafruit GFX Library"

          echo "Installing Adafruit SSD1306..."
          arduino-cli lib install "Adafruit SSD1306"

          echo "Installing Adafruit Unified Sensor..."
          arduino-cli lib install "Adafruit Unified Sensor"

          echo "Installing DHT sensor library..."
          arduino-cli lib install "DHT sensor library"

          echo "Installing Adafruit BME280..."
          arduino-cli lib install "Adafruit BME280 Library"

          echo "Installing BH1750..."
          arduino-cli lib install "BH1750@1.3.0"

          echo "Installing OneWire..."
          arduino-cli lib install "OneWire@2.3.8"

          echo "Installing DallasTemperature..."
          arduino-cli lib install "DallasTemperature"

          echo ""
          echo "=========================================="
          echo "INSTALLED LIBRARIES"
          echo "=========================================="

          arduino-cli lib list

      # ==========================================================
      # 7. Verify the actual sketch
      # ==========================================================
      - name: Verify Weather Station sketch
        run: |
          set -e

          echo "=========================================="
          echo "REPOSITORY CONTENTS"
          echo "=========================================="

          find . -maxdepth 3 -type f -print | sort

          echo ""
          echo "=========================================="
          echo "CHECKING SKETCH"
          echo "=========================================="

          test -f "ESP32 Weather Station.ino"

          ls -lh "ESP32 Weather Station.ino"

      # ==========================================================
      # 8. Compile
      # ==========================================================
      - name: Compile ESP32 Weather Station
        run: |
          set -e

          mkdir -p build

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-path build \
            --export-binaries \
            --warnings all \
            .

      # ==========================================================
      # 9. Display build information
      # ==========================================================
      - name: Inspect build output
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          if [ -d build ]; then
            find build -type f -print | sort
          else
            echo "Build directory does not exist."
          fi

          echo ""
          echo "=========================================="
          echo "FIRMWARE BINARIES"
          echo "=========================================="

          find build \
            -type f \
            -name "*.bin" \
            -exec ls -lh {} \; 2>/dev/null || true

      # ==========================================================
      # 10. Upload firmware artifacts
      # ==========================================================
      - name: Upload Weather Station firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-weather-station-firmware
          path: |
            build/**/*.bin
            build/**/*.elf
            build/**/*.map
          if-no-files-found: error
          retention-days: 30
