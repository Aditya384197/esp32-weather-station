name: ESP32 Weather Station Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile ESP32 Weather Station
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Install Arduino CLI from official release
      # ----------------------------------------------------------
      - name: Install Arduino CLI
        run: |
          set -e

          ARDUINO_CLI_VERSION="1.3.1"

          mkdir -p "$RUNNER_TEMP/arduino-cli"

          curl -fL \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz" \
            -o "$RUNNER_TEMP/arduino-cli/arduino-cli.tar.gz"

          tar -xzf \
            "$RUNNER_TEMP/arduino-cli/arduino-cli.tar.gz" \
            -C "$RUNNER_TEMP/arduino-cli"

          chmod +x "$RUNNER_TEMP/arduino-cli/arduino-cli"

          echo "$RUNNER_TEMP/arduino-cli" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/arduino-cli/arduino-cli" version

      # ----------------------------------------------------------
      # 3. Configure Arduino CLI
      # ----------------------------------------------------------
      - name: Configure Arduino CLI
        run: |
          set -e

          arduino-cli config init

          arduino-cli config set \
            board_manager.additional_urls \
            "https://espressif.github.io/arduino-esp32/package_esp32_index.json"

          arduino-cli config dump

      # ----------------------------------------------------------
      # 4. Update package index
      # ----------------------------------------------------------
      - name: Update board index
        run: |
          set -e

          arduino-cli core update-index

      # ----------------------------------------------------------
      # 5. Install ESP32 Arduino Core
      # ----------------------------------------------------------
      - name: Install ESP32 Arduino Core 3.5.5
        run: |
          set -e

          arduino-cli core install esp32:esp32@3.5.5

          echo ""
          echo "=========================================="
          echo "INSTALLED CORES"
          echo "=========================================="

          arduino-cli core list

      # ----------------------------------------------------------
      # 6. Update library index
      # ----------------------------------------------------------
      - name: Update library index
        run: |
          set -e

          arduino-cli lib update-index

      # ----------------------------------------------------------
      # 7. Install libraries
      # ----------------------------------------------------------
      - name: Install required libraries
        run: |
          set -e

          arduino-cli lib install "WiFiManager"
          arduino-cli lib install "ESP Async WebServer"
          arduino-cli lib install "Async TCP"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit BME280 Library"
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "BH1750"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"

          echo ""
          echo "=========================================="
          echo "INSTALLED LIBRARIES"
          echo "=========================================="

          arduino-cli lib list

      # ----------------------------------------------------------
      # 8. Verify sketch
      # ----------------------------------------------------------
      - name: Verify sketch
        run: |
          set -e

          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          find . -maxdepth 2 -type f -print

          echo ""
          echo "=========================================="
          echo "SKETCH"
          echo "=========================================="

          test -f "ESP32 Weather Station.ino"

          ls -lh "ESP32 Weather Station.ino"

      # ----------------------------------------------------------
      # 9. Compile
      # ----------------------------------------------------------
      - name: Compile ESP32 firmware
        run: |
          set -e

          mkdir -p build

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-path build \
            --export-binaries \
            --warnings all \
            .

      # ----------------------------------------------------------
      # 10. Inspect output
      # ----------------------------------------------------------
      - name: Inspect build output
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          find build -type f -print | sort || true

          echo ""
          echo "=========================================="
          echo "BIN FILES"
          echo "=========================================="

          find build \
            -type f \
            -name "*.bin" \
            -exec ls -lh {} \; || true

      # ----------------------------------------------------------
      # 11. Upload firmware
      # ----------------------------------------------------------
      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-weather-station-firmware
          path: |
            build/**/*.bin
            build/**/*.elf
            build/**/*.map
          if-no-files-found: error
          retention-days: 30
