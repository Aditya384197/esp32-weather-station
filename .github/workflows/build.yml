name: ESP32 Weather Station Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile ESP32 Weather Station
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          set -e

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core update-index

      - name: Install ESP32 Core 3.3.11
        run: |
          set -e

          arduino-cli core install esp32:esp32@3.3.11

          echo "=========================================="
          echo "ESP32 CORE"
          echo "=========================================="

          arduino-cli core list

      - name: Update library index
        run: |
          set -e
          arduino-cli lib update-index

      - name: Install required libraries
        run: |
          set -e

          arduino-cli lib install "WiFiManager@2.0.17"
          arduino-cli lib install "ArduinoJson@7.4.3"

          arduino-cli lib install "ESP Async WebServer@3.6.0"
          arduino-cli lib install "Async TCP@3.3.2"

          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "Adafruit BME280 Library"

          arduino-cli lib install "BH1750@1.3.0"
          arduino-cli lib install "OneWire@2.3.8"
          arduino-cli lib install "DallasTemperature"

          echo ""
          echo "=========================================="
          echo "INSTALLED LIBRARIES"
          echo "=========================================="

          arduino-cli lib list

      - name: Verify project files
        run: |
          set -e

          test -f "esp32-weather-station.ino"
          test -f "partitions.csv"

          echo "=========================================="
          echo "PARTITIONS.CSV"
          echo "=========================================="

          cat partitions.csv

      - name: Prepare custom partition table
        run: |
          set -e

          rm -rf build
          mkdir -p build

          # Explicitly place our custom partition table
          # into the Arduino build directory.
          cp partitions.csv build/partitions.csv

          echo "=========================================="
          echo "BUILD PARTITION TABLE"
          echo "=========================================="

          cat build/partitions.csv

      - name: Compile ESP32 Weather Station
        run: |
          set -e

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-path build \
            --export-binaries \
            --warnings all \
            --build-property "upload.maximum_size=1572864" \
            --build-property "upload.maximum_data_size=327680" \
            .

      - name: Verify generated partition table
        run: |
          set -e

          test -f "build/partitions.csv"

          echo "=========================================="
          echo "GENERATED PARTITION TABLE"
          echo "=========================================="

          cat build/partitions.csv

          echo ""
          echo "=========================================="
          echo "PARTITION BOUNDARY CHECK"
          echo "=========================================="

          grep -E '^(app0|app1|spiffs),' build/partitions.csv

      - name: Verify firmware
        run: |
          set -e

          test -f "build/esp32-weather-station.ino.bin"
          test -f "build/esp32-weather-station.ino.merged.bin"
          test -f "build/esp32-weather-station.ino.bootloader.bin"
          test -f "build/esp32-weather-station.ino.partitions.bin"

          echo ""
          echo "=========================================="
          echo "FIRMWARE BINARIES"
          echo "=========================================="

          ls -lh \
            build/esp32-weather-station.ino.bin \
            build/esp32-weather-station.ino.merged.bin \
            build/esp32-weather-station.ino.bootloader.bin \
            build/esp32-weather-station.ino.partitions.bin

      - name: Prepare firmware package
        run: |
          set -e

          rm -rf firmware
          mkdir -p firmware

          cp build/esp32-weather-station.ino.bin \
             firmware/esp32-weather-station.bin

          cp build/esp32-weather-station.ino.merged.bin \
             firmware/esp32-weather-station-merged.bin

          cp build/esp32-weather-station.ino.bootloader.bin \
             firmware/esp32-weather-station-bootloader.bin

          cp build/esp32-weather-station.ino.partitions.bin \
             firmware/esp32-weather-station-partitions.bin

          cp build/partitions.csv \
             firmware/partitions.csv

          echo ""
          echo "=========================================="
          echo "FINAL FIRMWARE PACKAGE"
          echo "=========================================="

          ls -lh firmware/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-weather-station-firmware
          path: firmware/
          if-no-files-found: error
          retention-days: 30
