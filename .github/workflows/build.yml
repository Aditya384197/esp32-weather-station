name: ESP32 Weather Station Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile ESP32 Weather Station
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Install Arduino CLI
      # ------------------------------------------------------------
      - name: Install Arduino CLI
  run: |
    mkdir -p "$HOME/bin"

    curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
      | BINDIR="$HOME/bin" sh

    echo "$HOME/bin" >> "$GITHUB_PATH"

    "$HOME/bin/arduino-cli" version

      # ------------------------------------------------------------
      # 3. Configure Arduino CLI
      # ------------------------------------------------------------
      - name: Configure Arduino CLI
        run: |
          arduino-cli config init

          arduino-cli config set \
            directories.data "$HOME/.arduino15"

          arduino-cli config set \
            directories.downloads "$HOME/.arduino15/staging"

      # ------------------------------------------------------------
      # 4. Add ESP32 Boards Manager URL
      # ------------------------------------------------------------
      - name: Add ESP32 package index
        run: |
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core update-index

      # ------------------------------------------------------------
      # 5. Install ESP32 Arduino Core 3.5.5
      # ------------------------------------------------------------
      - name: Install ESP32 Arduino Core
        run: |
          arduino-cli core install esp32:esp32@3.5.5

          arduino-cli core list

      # ------------------------------------------------------------
      # 6. Install required libraries
      # ------------------------------------------------------------
      - name: Install libraries
        run: |
          arduino-cli lib update-index

          # WiFiManager
          arduino-cli lib install "WiFiManager@2.0.17"

          # Async Web Server stack
          arduino-cli lib install "ESP Async WebServer@3.6.0"
          arduino-cli lib install "Async TCP@3.3.2"

          # ArduinoJson
          arduino-cli lib install "ArduinoJson@7.4.2"

          # Adafruit display / sensor libraries
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit BME280 Library"

          # DHT
          arduino-cli lib install "DHT sensor library"

          # BH1750
          arduino-cli lib install "BH1750"

          # OneWire / Dallas temperature
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"

          echo ""
          echo "========================================"
          echo "Installed Arduino libraries:"
          echo "========================================"

          arduino-cli lib list

      # ------------------------------------------------------------
      # 7. Verify sketch exists
      # ------------------------------------------------------------
      - name: Verify sketch
        run: |
          test -f "ESP32 Weather Station.ino"

          echo "Sketch found:"
          ls -lh "ESP32 Weather Station.ino"

      # ------------------------------------------------------------
      # 8. Compile
      # ------------------------------------------------------------
      - name: Compile firmware
        run: |
          mkdir -p build

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-path build \
            --export-binaries \
            --warnings all \
            "."

      # ------------------------------------------------------------
      # 9. Show build output
      # ------------------------------------------------------------
      - name: Show build artifacts
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "Build directory:"
          echo "========================================"

          find build -maxdepth 2 -type f -printf '%p\n' | sort

          echo ""
          echo "========================================"
          echo "Binary files:"
          echo "========================================"

          find build -type f \
            \( -name "*.bin" -o -name "*.elf" -o -name "*.map" \) \
            -exec ls -lh {} \; || true

      # ------------------------------------------------------------
      # 10. Upload compiled firmware
      # ------------------------------------------------------------
      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-weather-station-firmware
          path: |
            build/**/*.bin
            build/**/*.elf
            build/**/*.map
          if-no-files-found: error
          retention-days: 30
