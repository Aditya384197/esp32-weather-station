name: ESP32 Weather Station Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile ESP32 Weather Station
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Arduino CLI
      # ----------------------------------------------------------
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # ----------------------------------------------------------
      # Configure ESP32 package index
      # ----------------------------------------------------------
      - name: Configure Arduino CLI
        run: |
          set -e

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core update-index

      # ----------------------------------------------------------
      # Install the verified ESP32 Core
      # ----------------------------------------------------------
      - name: Install ESP32 Core 3.3.11
        run: |
          set -e

          arduino-cli core install esp32:esp32@3.3.11

          echo "=========================================="
          echo "ESP32 CORE"
          echo "=========================================="

          arduino-cli core list

      # ----------------------------------------------------------
      # Update library index
      # ----------------------------------------------------------
      - name: Update Arduino library index
        run: |
          set -e

          arduino-cli lib update-index

      # ----------------------------------------------------------
      # Install required libraries
      # ----------------------------------------------------------
      - name: Install Weather Station libraries
        run: |
          set -e

          arduino-cli lib install "WiFiManager@2.0.17"
          arduino-cli lib install "ArduinoJson@7.4.3"

          arduino-cli lib install "ESP Async WebServer@3.6.0"
          arduino-cli lib install "Async TCP@3.3.2"

          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "Adafruit BME280 Library"

          arduino-cli lib install "BH1750@1.3.0"
          arduino-cli lib install "OneWire@2.3.8"
          arduino-cli lib install "DallasTemperature"

          echo ""
          echo "=========================================="
          echo "INSTALLED LIBRARIES"
          echo "=========================================="

          arduino-cli lib list

      # ----------------------------------------------------------
      # Verify sketch
      # ----------------------------------------------------------
      - name: Verify Weather Station sketch
        run: |
          set -e

          echo "=========================================="
          echo "SKETCH"
          echo "=========================================="

          test -f "esp32-weather-station.ino"

          ls -lh "esp32-weather-station.ino"

      # ----------------------------------------------------------
      # Compile
      # ----------------------------------------------------------
      - name: Compile ESP32 Weather Station
        run: |
          set -e

          rm -rf build
          mkdir -p build

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-path build \
            --export-binaries \
            --warnings all \
            .

      # ----------------------------------------------------------
      # Verify generated firmware
      # ----------------------------------------------------------
      - name: Verify firmware output
        run: |
          set -e

          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          test -f "build/esp32-weather-station.ino.bin"
          test -f "build/esp32-weather-station.ino.merged.bin"
          test -f "build/esp32-weather-station.ino.bootloader.bin"
          test -f "build/esp32-weather-station.ino.partitions.bin"

          echo ""
          echo "Firmware successfully generated:"
          echo ""

          ls -lh \
            build/esp32-weather-station.ino.bin \
            build/esp32-weather-station.ino.merged.bin \
            build/esp32-weather-station.ino.bootloader.bin \
            build/esp32-weather-station.ino.partitions.bin

      # ----------------------------------------------------------
      # Create a clean firmware package
      # ----------------------------------------------------------
      - name: Prepare firmware package
        run: |
          set -e

          mkdir -p firmware

          cp "build/esp32-weather-station.ino.bin" \
             "firmware/esp32-weather-station.bin"

          cp "build/esp32-weather-station.ino.merged.bin" \
             "firmware/esp32-weather-station-merged.bin"

          cp "build/esp32-weather-station.ino.bootloader.bin" \
             "firmware/esp32-weather-station-bootloader.bin"

          cp "build/esp32-weather-station.ino.partitions.bin" \
             "firmware/esp32-weather-station-partitions.bin"

          echo "=========================================="
          echo "FIRMWARE PACKAGE"
          echo "=========================================="

          ls -lh firmware/

      # ----------------------------------------------------------
      # Upload firmware artifact
      # ----------------------------------------------------------
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-weather-station-firmware
          path: firmware/
          if-no-files-found: error
          retention-days: 30
