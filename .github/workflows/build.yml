name: ESP32 Weather Station Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile ESP32 Weather Station
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Install Arduino CLI
      # ----------------------------------------------------------
      - name: Install Arduino CLI
        run: |
          set -e

          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin"

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/bin/arduino-cli" version

      # ----------------------------------------------------------
      # 3. Configure Arduino CLI
      # ----------------------------------------------------------
      - name: Configure Arduino CLI
        run: |
          set -e

          arduino-cli config init

          arduino-cli config dump

      # ----------------------------------------------------------
      # 4. Add ESP32 Boards Manager
      # ----------------------------------------------------------
      - name: Configure ESP32 board package
        run: |
          set -e

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core update-index

      # ----------------------------------------------------------
      # 5. Install ESP32 Arduino Core 3.5.5
      # ----------------------------------------------------------
      - name: Install ESP32 Arduino Core
        run: |
          set -e

          arduino-cli core install esp32:esp32@3.5.5

          echo "Installed cores:"
          arduino-cli core list

      # ----------------------------------------------------------
      # 6. Update Arduino library index
      # ----------------------------------------------------------
      - name: Update library index
        run: |
          set -e

          arduino-cli lib update-index

      # ----------------------------------------------------------
      # 7. Install required libraries
      # ----------------------------------------------------------
      - name: Install required libraries
        run: |
          set -e

          arduino-cli lib install "WiFiManager"
          arduino-cli lib install "ESP Async WebServer"
          arduino-cli lib install "Async TCP"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit BME280 Library"
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "BH1750"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"

          echo ""
          echo "Installed libraries:"
          arduino-cli lib list

      # ----------------------------------------------------------
      # 8. Verify source file
      # ----------------------------------------------------------
      - name: Verify sketch
        run: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 2 -type f -print

          test -f "ESP32 Weather Station.ino"

          echo ""
          echo "Sketch found:"
          ls -lh "ESP32 Weather Station.ino"

      # ----------------------------------------------------------
      # 9. Compile firmware
      # ----------------------------------------------------------
      - name: Compile firmware
        run: |
          set -e

          mkdir -p build

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-path build \
            --export-binaries \
            --warnings all \
            .

      # ----------------------------------------------------------
      # 10. Show generated files
      # ----------------------------------------------------------
      - name: Inspect build output
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          find build -type f -print | sort || true

          echo ""
          echo "======================================"
          echo "BINARIES"
          echo "======================================"

          find build -type f -name "*.bin" -exec ls -lh {} \; || true

      # ----------------------------------------------------------
      # 11. Upload firmware
      # ----------------------------------------------------------
      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-weather-station-firmware
          path: |
            build/**/*.bin
            build/**/*.elf
            build/**/*.map
          if-no-files-found: error
          retention-days: 30
